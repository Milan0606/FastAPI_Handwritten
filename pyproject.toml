[project]
name = "fastapi-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Milan Aghera", email = "milan.aghera@bytestechnolab.com" }
]
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "pyjwt>=2.15.1",
    "pytest>=9.1.1",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
fastapi-demo = "fastapi_demo:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
